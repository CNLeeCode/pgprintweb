appId: com.pgprint.app
productName: pgprinter
copyright: 2025 BUTCOMPANY
# 跳过原生模块重编译：macOS 上 node-gyp 编译 serialport/usb 会因 SDK 不兼容失败。
# serialport/usb 自带 win32-x64 prebuilds，直接拷贝即可在 Windows 运行。
# 已移除 @thiagoelg/node-printer 和 better-sqlite3（无可用 prebuild / Node 引擎不兼容），
# RAW 字节流打印统一走系统命令行（macOS lp / Windows PowerShell RawPrinter）+ USB 直写。
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - "node_modules/**/*"
extraResources:
  - from: resources/
    to: resources/
asarUnpack:
  - "**/*.{node,dll}"
win:
  target: nsis
  # 图标在 resources/icon.ico（6 尺寸：16/32/48/64/128/256）
  # 用于：exe 文件图标、安装包图标、桌面/开始菜单快捷方式图标
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker
  # Win7 兼容：不使用 differentialDownload 增量更新
nsis:
  # 方案 C：安装向导模式，允许门店人员选择安装盘符/目录（应对 C 盘紧张的老 Win7 机器）
  oneClick: false
  # perMachine:true → 默认装到 C:\Program Files\pgprinter（全机器安装，需管理员权限）
  # 用户可在向导第二步改成 D:\pgprinter 等
  perMachine: true
  allowToChangeInstallationDirectory: true
  # 安装向导语言：简体中文 + 英文兜底（Win7 下确保中文界面）
  installerLanguages: zh_CN,en_US
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: pgprinter
  uninstallDisplayName: pgprinter
  # 安装完成后自动启动应用
  runAfterFinish: true
  # 不强制要求管理员权限升级提示，减少 Win7 UAC 干扰
  differentialPackage: false
# 方案 B：不再使用 electron-updater，无需 publish 配置。
#
# 显式禁止 electron-builder 自动发布到 GitHub Release 的功能由 CLI 选项
# `--publish never` 提供（见 package.json 的 build:win 脚本）。
# 注意：不要在 yml 里写 `publish: never`——yml 的 publish 字段期望的是 provider
# 配置对象（如 {provider: "github", ...}）或 provider 名字符串，"never" 会被当成
# 自定义 publisher 模块名，electron-builder 去 build/electron-publisher-never.js
# 加载，找不到就报 MODULE_NOT_FOUND 崩溃。
#
# 下载地址由后端 getAppUpdateInfo 接口返回，发版只需把 exe 丢到静态目录 + 改接口返回。