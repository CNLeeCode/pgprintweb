appId: com.pgprint.app
productName: pgprinter
copyright: 2025 BUTCOMPANY
# 跳过原生模块重编译：macOS 上 node-gyp 编译 serialport/usb 会因 SDK 不兼容失败。
# serialport/usb 自带 win32-x64 prebuilds，直接拷贝即可在 Windows 运行。
# 已移除 @thiagoelg/node-printer 和 better-sqlite3（无可用 prebuild / Node 引擎不兼容），
# RAW 字节流打印统一走系统命令行（macOS lp / Windows PowerShell RawPrinter）+ USB 直写。
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - "node_modules/**/*"
extraResources:
  - from: resources/
    to: resources/
asarUnpack:
  - "**/*.{node,dll}"
win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  # Win7 兼容：不使用 differentialDownload 增量更新
nsis:
  # 方案 B：一键安装，不问目录，门店人员双击即装
  oneClick: true
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: pgprinter
  uninstallDisplayName: pgprinter
  # 安装完成后自动启动应用
  runAfterFinish: true
# 显式禁止 electron-builder 自动发布到 GitHub Release。
# CI 环境下 electron-builder 会因 reason=CI detected 自动尝试 publish，
# 缺少 GH_TOKEN 时报 "GitHub Personal Access Token is not set" 中断构建。
# 本项目用 actions/upload-artifact 上传产物，不需要 electron-builder 自行发布。
# 下载地址由后端 getAppUpdateInfo 接口返回，发版只需把 exe 丢到静态目录 + 改接口返回。
publish: never